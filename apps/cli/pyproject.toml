[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdgpu-cli"
version = "0.1.0"
description = "CrowdGPU CLI — command-line interface for the CrowdGPU platform"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
crowdgpu-cli = "cli.main:cli"

[project.optional-dependencies]
webrtc = [
    "websockets>=12.0",
    "aiortc>=1.9.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
